services:
  game:
    build: .
    image: cursed-descent
    container_name: cursed-descent
    user: "${CURSED_UID:-1000}:${CURSED_GID:-1000}"
    ports:
      - "${CURSED_BIND:-127.0.0.1}:6969:6969"
    volumes:
      - ./game_data:/data
    environment:
      CURSED_DEBUG: "${CURSED_DEBUG:-0}"
    restart: unless-stopped
